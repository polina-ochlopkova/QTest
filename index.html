<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QTest</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>QTest</h1>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="pages/about.html">About</a></li>
          <li><a href="pages/contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="directors" aria-labelledby="directors-title">
        <div class="directors__inner">
          <h2 class="directors__title" id="directors-title">
            Meet the directors
          </h2>

          <ul class="directors__grid" role="list">
            <li class="director-card">
              <img
                class="director-card__photo"
                src="assets/images/nikita-marks.jpg"
                alt="Nikita Marks"
                width="100"
                height="100"
              />
              <h3 class="director-card__name">Nikita Marks</h3>
              <p class="director-card__role">Founder &amp; CEO</p>
              <button
                class="director-card__toggle"
                type="button"
                aria-expanded="false"
                aria-label="More about Nikita Marks"
              >
                +
              </button>
            </li>

            <li class="director-card">
              <img
                class="director-card__photo"
                src="assets/images/cristian-duncan.jpg"
                alt="Cristian Duncan"
                width="100"
                height="100"
              />
              <h3 class="director-card__name">Cristian Duncan</h3>
              <p class="director-card__role">Co-founder &amp; COO</p>
              <button
                class="director-card__toggle"
                type="button"
                aria-expanded="false"
                aria-label="More about Cristian Duncan"
              >
                +
              </button>
            </li>

            <li class="director-card">
              <img
                class="director-card__photo"
                src="assets/images/cruz-hamer.jpg"
                alt="Cruz Hamer"
                width="100"
                height="100"
              />
              <h3 class="director-card__name">Cruz Hamer</h3>
              <p class="director-card__role">Co-founder &amp; CTO</p>
              <button
                class="director-card__toggle"
                type="button"
                aria-expanded="false"
                aria-label="More about Cruz Hamer"
              >
                +
              </button>
            </li>

            <li class="director-card">
              <img
                class="director-card__photo"
                src="assets/images/drake-heaton.jpg"
                alt="Drake Heaton"
                width="100"
                height="100"
              />
              <h3 class="director-card__name">Drake Heaton</h3>
              <p class="director-card__role">Business Development Lead</p>
              <button
                class="director-card__toggle"
                type="button"
                aria-expanded="false"
                aria-label="More about Drake Heaton"
              >
                +
              </button>
            </li>

            <li class="director-card">
              <img
                class="director-card__photo"
                src="assets/images/griffin-wise.jpg"
                alt="Griffin Wise"
                width="100"
                height="100"
              />
              <h3 class="director-card__name">Griffin Wise</h3>
              <p class="director-card__role">Lead Marketing</p>
              <button
                class="director-card__toggle"
                type="button"
                aria-expanded="false"
                aria-label="More about Griffin Wise"
              >
                +
              </button>
            </li>

            <li class="director-card">
              <img
                class="director-card__photo"
                src="assets/images/aden-allan.jpg"
                alt="Aden Allan"
                width="100"
                height="100"
              />
              <h3 class="director-card__name">Aden Allan</h3>
              <p class="director-card__role">Account Manager</p>
              <button
                class="director-card__toggle"
                type="button"
                aria-expanded="false"
                aria-label="More about Aden Allan"
              >
                +
              </button>
            </li>
          </ul>
        </div>
      </section>
    </main>
  </body>
</html>
