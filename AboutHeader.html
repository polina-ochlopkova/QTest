<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>About | myteam</title>
<link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <section class="about-hero" aria-labelledby="about-title">
        <img
          class="about-hero__decoration"
          src="assets/about-header-decor.svg"
          alt=""
          aria-hidden="true"
        >

        <div class="page-container">
          <header class="site-header">
            <a class="brand" href="#" aria-label="myteam home">
              <img src="assets/logo.svg" alt="myteam" width="160" height="40">
            </a>

            <nav class="primary-nav" aria-label="Main navigation">
              <a href="#">home</a>
              <a href="#" aria-current="page">about</a>
            </nav>

            <button class="contact-button" type="button">contact us</button>
          </header>

          <div class="about-intro">
            <h1 id="about-title">About</h1>

            <div class="about-intro__copy">
              <span class="about-intro__accent" aria-hidden="true"></span>
              <p>
                We help companies build dynamic teams made up of top global talent.
                Using our network of passionate professionals we drive innovation
                and deliver incredible outcomes. Talented, diverse teams shape the
                best products and experiences. We’ll bring those teams to you.
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
